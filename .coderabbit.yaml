language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    ignore_title_patterns:
      - '^chore: bump version'
      - '^chore\(deps\)'
    labels_auto_enabled: true
chat:
  auto_reply: true
  persist: true